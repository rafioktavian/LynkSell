steps:
  # Step 1: Build container image menggunakan Dockerfile multi-stage
  - name: 'gcr.io/cloud-builders/docker'
    args: [ 'build', '-t', 'us-west1-docker.pkg.dev/lateral-nomad-300414/cloud-run-source-deploy/lynksell:$COMMIT_SHA', '.' ]

  # Step 2: Push image ke Artifact Registry modern us-west1
  - name: 'gcr.io/cloud-builders/docker'
    args: [ 'push', 'us-west1-docker.pkg.dev/lateral-nomad-300414/cloud-run-source-deploy/lynksell:$COMMIT_SHA' ]

  # Step 3: Deploy ke Cloud Run menggunakan image dari Artifact Registry
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'lynksell'
      - '--image'
      - 'us-west1-docker.pkg.dev/lateral-nomad-300414/cloud-run-source-deploy/lynksell:$COMMIT_SHA'
      - '--region'
      - 'us-west1'
      - '--platform'
      - 'managed'

# Memaksa Cloud Build menyewa mesin besar ber-RAM longgar agar tidak OOM
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY